<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mosaic — Uzbek tile study</title>
<meta name="description" content="An Uzbek geometric ornament built from 3,400 individual ceramic tiles that dissolve into a swirling system and reassemble.">
<style>
  :root {
    --bg: #f3ebe2;
    --ink: #0a2a9e;
    --ink-soft: rgba(10, 42, 158, .62);
    --line: rgba(10, 42, 158, .2);
    --pill: rgba(250, 245, 236, .72);
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: var(--mono); color: var(--ink); -webkit-font-smoothing: antialiased; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

  .hud { position: fixed; inset: 0; pointer-events: none; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; justify-content: flex-end; }

  .bar { pointer-events: auto; align-self: center; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; padding: 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--pill); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); max-width: 100%; }
  button { font: inherit; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 999px; padding: 9px 14px; cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
  button:hover { border-color: var(--line); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--ink); color: #f6efe4; }
  .seg { display: flex; gap: 2px; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
  .speed { display: flex; align-items: center; gap: 10px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 0 10px; }
  .speed output { min-width: 3.4ch; text-align: right; color: var(--ink-soft); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 110px; height: 2px; background: var(--line); border-radius: 2px; outline-offset: 6px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 2px; background: var(--ink); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 2px; background: var(--ink); cursor: pointer; }

  @media (max-width: 640px) {
    .hud { padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); }
    .bar { border-radius: 22px; }
    .speed { order: 5; width: 100%; justify-content: center; padding-bottom: 4px; }
    input[type=range] { width: 160px; }
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="c" aria-label="Interactive mosaic of ceramic tiles forming an Uzbek geometric ornament" role="img"></canvas>

<div class="hud">
  <div class="bar" role="toolbar" aria-label="Animation controls">
    <button id="play" type="button" aria-pressed="true" title="Play / pause (Space)">Pause</button>
    <div class="seg" role="group" aria-label="Mode">
      <button id="mAuto" type="button" aria-pressed="true" title="Loops on its own (M)">Autoplay</button>
      <button id="mInt" type="button" aria-pressed="false" title="Rests assembled; hover and click to play (M)">Interactive</button>
    </div>
    <label class="speed"><span>Speed</span>
      <input id="speed" type="range" min="0.25" max="2.5" step="0.05" value="1" aria-label="Animation speed">
      <output id="speedOut" for="speed">1.0×</output>
    </label>
    <button id="reset" type="button" title="Return to the assembled mosaic (R)">Reset</button>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script src="tiles.js"></script>
<script src="mosaic-image.js"></script>
<script src="app.js"></script>
</body>
</html>
